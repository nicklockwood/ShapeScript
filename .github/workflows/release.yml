name: Build Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true

jobs:
  macos:
    name: Build and notarize macOS Viewer app
    runs-on: xcode-27

    steps:
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Import Code Signing Certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_CERTIFICATE_BASE64" ]; then
            echo "ERROR: DEVELOPER_ID_CERTIFICATE_BASE64 secret is empty or not set"
            exit 1
          fi
          if [ -z "$DEVELOPER_ID_CERTIFICATE_PASSWORD" ]; then
            echo "ERROR: DEVELOPER_ID_CERTIFICATE_PASSWORD secret is empty or not set"
            exit 1
          fi

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          trap 'rm -f certificate.p12' EXIT
          security import certificate.p12 -k build.keychain -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          security find-identity -v -p codesigning build.keychain
          if ! security find-identity -v -p codesigning build.keychain | grep -q "Developer ID Application: .* (8VQKF583ED)"; then
            echo "ERROR: DEVELOPER_ID_CERTIFICATE_BASE64 must contain a Developer ID Application certificate for team 8VQKF583ED with its private key"
            exit 1
          fi

      - name: Install Developer ID provisioning profiles
        env:
          VIEWER_PROVISIONING_PROFILE_BASE64: ${{ secrets.VIEWER_PROVISIONING_PROFILE_BASE64 }}
          PREVIEW_PROVISIONING_PROFILE_BASE64: ${{ secrets.PREVIEW_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import datetime
          import os
          import pathlib
          import plistlib
          import subprocess
          import tempfile
          import uuid

          profiles = (
              ("VIEWER", "com.charcoaldesign.ShapeScriptMacViewer", "Viewer/Mac/Viewer.entitlements"),
              ("PREVIEW", "com.charcoaldesign.ShapeScriptMacViewer.Preview", "Preview/Preview.entitlements"),
          )
          destination = pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          destination.mkdir(parents=True, exist_ok=True)
          for target, bundle_id, entitlements_path in profiles:
              secret = target + "_PROVISIONING_PROFILE_BASE64"
              encoded = os.environ.get(secret, "")
              if not encoded:
                  raise SystemExit(f"ERROR: {secret} must contain a base64-encoded Developer ID provisioning profile")
              data = base64.b64decode("".join(encoded.split()), validate=True)
              with tempfile.NamedTemporaryFile() as source:
                  source.write(data)
                  source.flush()
                  decoded = subprocess.check_output(["security", "cms", "-D", "-i", source.name])
              profile = plistlib.loads(decoded)
              entitlements = profile["Entitlements"]
              expected_id = "8VQKF583ED." + bundle_id
              if profile.get("TeamIdentifier") != ["8VQKF583ED"] or entitlements.get("com.apple.application-identifier") != expected_id:
                  raise SystemExit(f"ERROR: {secret} does not match team 8VQKF583ED and {bundle_id}")
              if profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
                  raise SystemExit(f"ERROR: {secret} has expired")
              required = plistlib.loads(pathlib.Path(entitlements_path).read_bytes())
              groups = required["com.apple.security.application-groups"]
              if not set(groups).issubset(entitlements.get("com.apple.security.application-groups", [])):
                  raise SystemExit(f"ERROR: {secret} does not authorize the target's App Groups")
              # Validate the UUID, but preserve its spelling for Xcode profile lookup.
              profile_id = profile["UUID"]
              uuid.UUID(profile_id)
              (destination / (profile_id + ".provisionprofile")).write_bytes(data)
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write(f"{target}_PROVISIONING_PROFILE={profile_id}\n")
          PYTHON

      - name: Validate notarization credentials
        env:
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          if [ -z "$NOTARIZATION_USERNAME" ]; then
            echo "ERROR: NOTARIZATION_USERNAME secret is empty or not set"
            exit 1
          fi
          if [ -z "$NOTARIZATION_PASSWORD" ]; then
            echo "ERROR: NOTARIZATION_PASSWORD secret is empty or not set"
            exit 1
          fi

      - name: Configure target provisioning profiles
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          project_path = "ShapeScript.xcodeproj/project.pbxproj"
          project = json.loads(subprocess.check_output([
              "plutil", "-convert", "json", "-o", "-", project_path,
          ]))
          objects = project["objects"]
          targets = {
              "Viewer (Mac)": os.environ["VIEWER_PROVISIONING_PROFILE"],
              "Preview (Mac)": os.environ["PREVIEW_PROVISIONING_PROFILE"],
          }
          # plutil cannot edit OpenStep files in place; Xcode also accepts XML plists.
          subprocess.run(["plutil", "-convert", "xml1", project_path], check=True)
          configured = set()
          for target in objects.values():
              if target.get("isa") != "PBXNativeTarget" or target.get("name") not in targets:
                  continue
              configurations = objects[target["buildConfigurationList"]]["buildConfigurations"]
              for config_id in configurations:
                  if objects[config_id]["name"] != "Release":
                      continue
                  subprocess.run([
                      "plutil", "-replace",
                      f"objects.{config_id}.buildSettings.PROVISIONING_PROFILE_SPECIFIER",
                      "-string", targets[target["name"]], project_path,
                  ], check=True)
                  configured.add(target["name"])
          if configured != set(targets):
              raise SystemExit("ERROR: Could not configure both Release app targets")
          PYTHON

      - name: Archive ShapeScript Viewer
        run: |
          ARCHIVE_PATH="build/ShapeScriptViewer.xcarchive"
          xcodebuild \
            -project ShapeScript.xcodeproj \
            -scheme "Viewer (Mac)" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="8VQKF583ED" \
            VIEWER_PROVISIONING_PROFILE="$VIEWER_PROVISIONING_PROFILE" \
            PREVIEW_PROVISIONING_PROFILE="$PREVIEW_PROVISIONING_PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $HOME/Library/Keychains/build.keychain-db" \
            archive

      - name: Copy archived app
        id: export-app
        run: |
          ARCHIVE_PATH="build/ShapeScriptViewer.xcarchive"
          EXPORT_PATH="build/Export"
          mkdir -p "$EXPORT_PATH"

          cp -R "$ARCHIVE_PATH/Products/Applications/ShapeScript Viewer.app" "$EXPORT_PATH/"

          APP_PATH="$EXPORT_PATH/ShapeScript Viewer.app"
          echo "app-path=$APP_PATH" >> $GITHUB_OUTPUT

          codesign --verify --deep --strict "$APP_PATH"

      - name: Notarize app
        id: notarize
        uses: lando/notarize-action@v2
        with:
          product-path: ${{ steps.export-app.outputs.app-path }}
          appstore-connect-username: ${{ secrets.NOTARIZATION_USERNAME }}
          appstore-connect-password: ${{ secrets.NOTARIZATION_PASSWORD }}
          appstore-connect-team-id: 8VQKF583ED
          primary-bundle-id: com.charcoaldesign.ShapeScriptMacViewer
          verbose: true

      - name: Staple notarization
        run: |
          xcrun stapler staple "${{ steps.export-app.outputs.app-path }}"
          spctl -a -v "${{ steps.export-app.outputs.app-path }}"

      - name: Get notarization logs
        if: failure() && steps.notarize.outcome == 'failure'
        run: |
          xcrun notarytool history --team-id 8VQKF583ED --apple-id "${{ secrets.NOTARIZATION_USERNAME }}" --password "${{ secrets.NOTARIZATION_PASSWORD }}"
          REQUEST_UUID=$(xcrun notarytool history --team-id 8VQKF583ED --apple-id "${{ secrets.NOTARIZATION_USERNAME }}" --password "${{ secrets.NOTARIZATION_PASSWORD }}" | grep -E "id:\s*[a-f0-9-]{36}" | head -1 | sed 's/.*id: //')
          if [ -n "$REQUEST_UUID" ]; then
            xcrun notarytool log "$REQUEST_UUID" --team-id 8VQKF583ED --apple-id "${{ secrets.NOTARIZATION_USERNAME }}" --password "${{ secrets.NOTARIZATION_PASSWORD }}"
          fi

      - name: Zip app
        run: |
          cd "$(dirname "${{ steps.export-app.outputs.app-path }}")"
          zip -r --symlinks "ShapeScriptViewer-macos.zip" "ShapeScript Viewer.app"
          echo "ZIP_PATH=$(pwd)/ShapeScriptViewer-macos.zip" >> $GITHUB_ENV

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: shapescript_viewer_macos
          path: ${{ env.ZIP_PATH }}
          retention-days: 5

  linux:
    name: Build Linux command line app
    runs-on: ubuntu-latest
    container:
      image: swift:5.10-focal
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --security-opt apparmor=unconfined

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build release binary
        run: |
          swift build --configuration release --static-swift-stdlib
          BIN_PATH="$(swift build --configuration release --show-bin-path)/shapescript"
          strip "$BIN_PATH"
          mkdir -p release
          cp "$BIN_PATH" release/shapescript
          chmod +x release/shapescript

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: shapescript_linux
          path: release/shapescript
          retention-days: 5

  upload:
    name: Upload release artifacts
    runs-on: ubuntu-latest
    needs: [macos, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: downloaded_artifacts

      - name: Display downloaded artifacts
        run: ls -R downloaded_artifacts

      - name: Zip Linux binary
        run: |
          chmod +x downloaded_artifacts/shapescript_linux/shapescript
          zip -j "ShapeScriptCLI-linux-x86_64.zip" downloaded_artifacts/shapescript_linux/shapescript

      - name: Upload release assets
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" \
            "downloaded_artifacts/shapescript_viewer_macos/ShapeScriptViewer-macos.zip#ShapeScript Viewer for macOS" \
            "ShapeScriptCLI-linux-x86_64.zip#ShapeScript CLI for Linux" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
